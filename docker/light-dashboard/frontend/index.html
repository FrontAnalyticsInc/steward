<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Steward</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN (Production versions) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (Web component version) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Markdown rendering + sanitization for agent replies -->
    <script src="https://unpkg.com/marked@15/marked.min.js"></script>
    <script src="https://unpkg.com/dompurify@3.2.6/dist/purify.min.js"></script>
    <!-- Theme, applied before the first paint.
         React mounts a second or two after this file lands (Babel has to
         compile the whole app first), so a theme applied from inside App()
         would show the dark page first and flip under the reader. This reads
         the same key the Appearance settings write and stamps <html> now. -->
    <script>
        (function () {
            var pref = null;
            try { pref = localStorage.getItem('hermes.theme'); } catch (e) {}
            if (pref !== 'light' && pref !== 'dark') {
                pref = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.dataset.theme = pref;
        })();
    </script>
    <style>
        /* Custom scrollbar styling for a sleeker dark look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #45475a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #585b70;
        }
        html[data-theme="light"] ::-webkit-scrollbar-track { background: #e6e9ef; }
        html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #bcc0cc; }
        html[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #acb0be; }

        /* The few colours that are set from JS rather than from a class, so
           they cannot be reached by the generated overrides below. Anything
           computed in a style={{}} should read one of these instead of a
           literal hex. */
        :root {
            --acc-red: #f38ba8;
            --acc-green: #a6e3a1;
            --acc-yellow: #f9e2af;
            --acc-blue: #89b4fa;
            --acc-lavender: #b4befe;
            --acc-mauve: #cba6f7;
            --acc-sky: #89dceb;
            --acc-peach: #fab387;
            --txt-muted: #585b70;
            --txt-subtle: #a6adc8;
            /* Text that sits on top of one of the accents above. */
            --on-accent: #11111b;
            color-scheme: dark;
        }
        html[data-theme="light"] {
            --acc-red: #d20f39;
            --acc-green: #40a02b;
            --acc-yellow: #df8e1d;
            --acc-blue: #1e66f5;
            --acc-lavender: #7287fd;
            --acc-mauve: #8839ef;
            --acc-sky: #04a5e5;
            --acc-peach: #fe640b;
            --txt-muted: #7c7f93;
            --txt-subtle: #5c5f77;
            --on-accent: #eff1f5;
            color-scheme: light;
        }

        /* Main tab panels always reserve their scrollbar gutter.
         *
         * With overflow-y-auto the bar appears only when content overflows, so
         * switching between a long tab and a short one shifted the whole panel
         * 6px sideways. `scroll` keeps the track painted and simply omits the
         * thumb when there is nothing to scroll — visible, inactive, no shift.
         *
         * Scoped to the tab panels (p-6) on purpose: the sidebar lists (p-3)
         * and the evidence card (p-5) are narrow, and an always-on track reads
         * as clutter there. */
        .h-full.overflow-y-auto.p-6,
        .flex-1.overflow-y-auto.p-6 {
            overflow-y: scroll;
        }

        /* High contrast styles for Approvals */
        .body-textarea {
            font-family: monospace;
            line-height: 1.6;
        }
        .body-textarea:focus {
            border-color: #f5c2e7;
        }

        /* Icons are painted inside their <i> host, so the host owns the sizing */
        [data-lucide] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        [data-lucide] > svg {
            width: 100%;
            height: 100%;
        }

        /* Markdown rendering for Hermes chat replies */
        .markdown-body > *:first-child { margin-top: 0; }
        .markdown-body > *:last-child { margin-bottom: 0; }
        .markdown-body p { margin: 0.5rem 0; }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            font-weight: 700;
            color: #b4befe;
            margin: 0.9rem 0 0.4rem;
            line-height: 1.3;
        }
        .markdown-body h1 { font-size: 1.15rem; }
        .markdown-body h2 { font-size: 1.05rem; }
        .markdown-body h3 { font-size: 0.95rem; }
        .markdown-body h4 { font-size: 0.875rem; }
        .markdown-body strong { font-weight: 700; color: inherit; }
        .markdown-body em { font-style: italic; }
        .markdown-body ul,
        .markdown-body ol {
            margin: 0.5rem 0;
            padding-left: 1.25rem;
        }
        .markdown-body ul { list-style: disc; }
        .markdown-body ol { list-style: decimal; }
        .markdown-body li { margin: 0.2rem 0; }
        .markdown-body a { color: #89b4fa; text-decoration: underline; }
        .markdown-body code {
            font-family: monospace;
            font-size: 0.8125rem;
            background: #11111b;
            border: 1px solid #313244;
            border-radius: 4px;
            padding: 0.05rem 0.3rem;
        }
        .markdown-body pre {
            background: #11111b;
            border: 1px solid #313244;
            border-radius: 8px;
            padding: 0.75rem;
            margin: 0.6rem 0;
            overflow-x: auto;
        }
        .markdown-body pre code {
            background: transparent;
            border: none;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 3px solid #45475a;
            padding-left: 0.75rem;
            margin: 0.6rem 0;
            color: #a6adc8;
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid #313244;
            margin: 0.8rem 0;
        }
        .markdown-body table {
            border-collapse: collapse;
            margin: 0.6rem 0;
            display: block;
            overflow-x: auto;
        }
        .markdown-body th,
        .markdown-body td {
            border: 1px solid #313244;
            padding: 0.3rem 0.6rem;
            text-align: left;
        }
        .markdown-body th { background: #181825; font-weight: 700; }

        /* Markdown is styled from element selectors, not from utilities, so it
           needs its own flip. */
        html[data-theme="light"] .markdown-body h1,
        html[data-theme="light"] .markdown-body h2,
        html[data-theme="light"] .markdown-body h3,
        html[data-theme="light"] .markdown-body h4 { color: #7287fd; }
        html[data-theme="light"] .markdown-body a { color: #1e66f5; }
        html[data-theme="light"] .markdown-body code,
        html[data-theme="light"] .markdown-body pre { background: #e6e9ef; border-color: #ccd0da; }
        html[data-theme="light"] .markdown-body blockquote { border-left-color: #bcc0cc; color: #5c5f77; }
        html[data-theme="light"] .markdown-body hr { border-top-color: #ccd0da; }
        html[data-theme="light"] .markdown-body th,
        html[data-theme="light"] .markdown-body td { border-color: #ccd0da; }
        html[data-theme="light"] .markdown-body th { background: #e6e9ef; }
        html[data-theme="light"] .body-textarea:focus { border-color: #ea76cb; }

        /* --- Stack health indicator --------------------------------------
         * The header light flashes only when a service is actually down, and
         * it keeps flashing until it is not. Everything else on this page that
         * wants attention has a badge; this one is allowed to move, because a
         * dead service in this stack is the one condition where a reader
         * looking at some other tab still needs to be interrupted.
         *
         * Hand-written rather than a Tailwind class: the animation
         * interpolates between two colours, which an arbitrary-value utility
         * cannot express, and the generated light-theme block below overrides
         * classes it can see — so both themes are spelled out here.
         *
         * Honours prefers-reduced-motion by dropping to a steady high-contrast
         * red. Someone who cannot tolerate a flashing element still has to be
         * told the stack is down; the colour carries that on its own. */
        @keyframes health-alarm {
            0%, 100% { background-color: #f38ba8; color: #11111b; border-color: #f38ba8; }
            50%      { background-color: rgba(243,139,168,0.12); color: #f38ba8; border-color: #f38ba8; }
        }
        .health-alarm {
            animation: health-alarm 1.1s ease-in-out infinite;
            border-width: 1px;
            border-style: solid;
        }
        html[data-theme="light"] .health-alarm {
            animation-name: health-alarm-light;
        }
        @keyframes health-alarm-light {
            0%, 100% { background-color: #d20f39; color: #eff1f5; border-color: #d20f39; }
            50%      { background-color: rgba(210,15,57,0.10); color: #d20f39; border-color: #d20f39; }
        }
        @media (prefers-reduced-motion: reduce) {
            .health-alarm {
                animation: none;
                background-color: #f38ba8;
                color: #11111b;
                border-color: #f38ba8;
            }
            html[data-theme="light"] .health-alarm {
                background-color: #d20f39;
                color: #eff1f5;
                border-color: #d20f39;
            }
        }

         * a class name (bg-[#11111b]), which is the price of a buildless
