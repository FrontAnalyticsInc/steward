; Rootdir marker as much as configuration: it has to sit beside backend/ so
; `backend.test_integrations` imports as a package, which is how the tests
; already refer to their own modules (`from . import integrations as I`).
[pytest]
testpaths = backend
python_files = test_*.py

; Quieter than the default banner, and -ra so a skipped or xfailed test says so
; at the end rather than hiding behind a dot.
addopts = -ra --strict-markers
