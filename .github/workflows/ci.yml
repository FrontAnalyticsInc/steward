name: CI

# What this repo can verify without credentials, which is everything it ships.
# There is no publish job and no secret: Steward is installed by building from
# this source on the target box, so there is no registry to push to and nothing
# for a release to upload. A green run here means an install has a chance of
# working; it is not a substitute for running install.sh on a real machine.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    name: Compose renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two renders, because there are two ways to run this stack and only one
      # of them is exercised by an install. The standalone render is the
      # pull-based topology; check_standalone.py asserts it needs nothing but
      # images, which is what keeps host paths from creeping back into it.
      - name: Render the standalone stack
        working-directory: docker
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            -f docker-compose.standalone.yml \
            config --no-interpolate > "${RUNNER_TEMP}/steward-stack.yml"

      - name: Assert it needs nothing but images
        run: python3 infra/check_standalone.py "${RUNNER_TEMP}/steward-stack.yml"

      # The one install.sh actually renders: interpolated, from an env file,
      # exactly as the installer does it. Un-interpolated is NOT equivalent —
      # it leaves every bind-mount source as literal "${VAR-default}", which
      # compose types as a named volume and then rejects at `up`. That shipped
      # once; these three steps are why it cannot ship again.
      - name: Render the source-build stack the way install.sh does
        working-directory: docker
        run: |
          docker compose --env-file .env.bare.example \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            -f docker-compose.standalone.yml \
            -f docker-compose.source.yml \
            config > "${RUNNER_TEMP}/steward-source.yml"

      # The check the installer performs on the operator's box, performed here
      # instead. `config -q` on the rendered file is what `up` does first.
      - name: Assert compose can read back what it rendered
        run: docker compose -f "${RUNNER_TEMP}/steward-source.yml" config -q

      - name: Assert build contexts resolve and no bind became a named volume
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, yaml
          stack = yaml.safe_load(pathlib.Path(os.environ["RUNNER_TEMP"], "steward-source.yml").read_text())
          declared = set(stack.get("volumes") or {})
          problems, built, binds = [], [], 0
          for name, svc in sorted(stack.get("services", {}).items()):
              for m in svc.get("volumes") or []:
                  if not isinstance(m, dict):
                      continue
                  if m.get("type") == "bind":
                      binds += 1
                      if not str(m.get("source", "")).startswith("/"):
                          problems.append(f"{name}: bind source {m.get('source')!r} is not absolute")
                  elif m.get("type") == "volume" and m.get("source") not in declared:
                      problems.append(
                          f"{name}: {m.get('source')!r} -> {m.get('target')!r} typed as a named "
                          f"volume but never declared. It is a bind the render failed to recognise."
                      )
              build = svc.get("build")
              if not build:
                  continue
              built.append(name)
              ctx = pathlib.Path(build["context"])
              dockerfile = ctx / build.get("dockerfile", "Dockerfile")
              if not ctx.is_dir():
                  problems.append(f"{name}: context {ctx} is not a directory")
              elif not dockerfile.is_file():
                  problems.append(f"{name}: {dockerfile} does not exist")
          print(f"built from source: {', '.join(built)}")
          print(f"bind mounts: {binds}")
          if problems:
              sys.exit("\n".join(problems))
          # Six, not seven: browser sits behind a compose profile that a
          # default install does not enable, so it is absent from the stack
          # install.sh actually writes. Its build context is covered by the
          # standalone render above.
          expected = {"docs", "hermes-gateway", "hermes-init", "light-dashboard",
                      "review-executor", "workflows"}
          if set(built) != expected:
              sys.exit(f"buildable services changed: expected {sorted(expected)}, got {sorted(built)}")
          if binds == 0:
              sys.exit("no bind mounts at all — the render is not what install.sh produces")
          PY

  shell:
    name: Installer and upgrade runner parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n install.sh && bash -n hermes-update.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: error

  checks:
    name: Infra checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate cloud-init renders and parses
        run: |
          pip install pyyaml
          python3 infra/check_cloud_init.py

      # Executes marker.sh, migrate.sh and hermes-update.sh against a temporary
      # data disk with synthesised migrations. v0.1.0 ships zero migration
      # files, so every real run of this machinery is a no-op — which is
      # indistinguishable from a broken runner until the first release that
      # ships one, on somebody's data.
      - name: Upgrade machinery
        run: python3 infra/check_migrations.py

  console:
    name: Console backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest.ini at the project root is the rootdir marker the suite needs; run
      # from here rather than from the repo root, or the tests import a
      # different `backend`.
      - name: pytest
        working-directory: docker/light-dashboard
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pytest backend -q

  workflows:
    name: Workflow unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unit tests only. The eval suite calls a model and needs a billable
      # credential, so it is not a gate here.
      - name: pytest
        working-directory: workflows
        run: |
          pipx install uv || pip install uv
          uv sync --frozen
          uv run pytest tests/unit -q
